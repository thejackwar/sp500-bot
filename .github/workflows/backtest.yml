name: Backtest

on:
  workflow_dispatch:          # run it by hand: Actions -> Backtest -> Run workflow
    inputs:
      market:
        description: "Stocks (S&P 100) or crypto (top 10 coins)"
        type: choice
        options: ["stocks", "crypto"]
        default: "stocks"
      years:
        description: "How many years to test"
        type: choice
        options: ["1", "3", "5", "8"]
        default: "5"
      test:
        description: "What to compare"
        type: choice
        options: ["strategies", "bot versions", "patterns"]
        default: "strategies"
      runs:
        description: "Start dates per version (more = more reliable, slower)"
        type: choice
        options: ["10", "5", "1"]
        default: "10"

permissions:
  contents: write              # to commit the results to reports/backtest/

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Prices saved by earlier runs: only the first run downloads the full history
      - name: Restore saved prices
        uses: actions/cache/restore@v4
        with:
          path: price-cache
          key: price-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: price-cache-

      - name: Backtest
        run: python backtest.py
        env:
          PYTHONUNBUFFERED: "1"
          MARKET: ${{ inputs.market }}
          YEARS: ${{ inputs.years }}
          TEST: ${{ inputs.test }}
          RUNS: ${{ inputs.runs }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.market == 'crypto' && secrets.TELEGRAM_CHAT_ID_CRYPTO || secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      - name: Save prices for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: price-cache
          key: price-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the results with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest-results/
          if-no-files-found: ignore

      - name: Commit the results to reports/backtest/
        if: always()
        run: |
          [ -f backtest-results/summary.txt ] || { echo "No results"; exit 0; }
          dir="reports/backtest/${{ inputs.market }}-$(echo '${{ inputs.test }}' | tr ' ' '-')-${{ inputs.years }}y"
          mkdir -p "$dir"
          cp backtest-results/summary.txt backtest-results/trades.csv "$dir"/
          for f in details.txt patterns.csv; do [ -f "backtest-results/$f" ] && cp "backtest-results/$f" "$dir"/; done
          echo "Run ${{ github.run_id }}, $(date -u '+%Y-%m-%d %H:%M UTC'), runs=${{ inputs.runs }}" > "$dir/run.txt"
          git config user.name "backtest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Backtest results: $dir"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
