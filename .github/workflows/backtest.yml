name: Backtest

on:
  workflow_dispatch:          # run it by hand: Actions -> Backtest -> Run workflow
    inputs:
      market:
        description: "Stocks (S&P 100) or crypto (top 10 coins)"
        type: choice
        options: ["stocks", "crypto"]
        default: "stocks"
      years:
        description: "How many years to test"
        type: choice
        options: ["1", "3", "5", "8", "from 2015", "from 2018", "from 2021"]
        default: "5"
      test:
        description: "What to compare"
        type: choice
        options: ["strategies", "bot versions", "patterns"]
        default: "strategies"
      bot_candles:
        description: "Bot versions / strategies only: the bot's intraday chart (15m = like live)"
        type: choice
        options: ["15m", "1h"]
        default: "15m"
      pattern_candles:
        description: "Patterns test only: which candles to find patterns on (15m: max 5 years). deck = the Fidelity-deck patterns of the pattern scan / deck_trader.py (daily)"
        type: choice
        options: ["daily", "1h", "15m", "deck"]
        default: "daily"
      coins:
        description: "Crypto: which coins (BTC only = no coin-picking bias; each coin = every top coin on its own). Stocks: each stock = every S&P 100 stock + SPY on its own"
        type: choice
        options: ["top 10", "BTC", "BTC ETH", "each coin", "each stock", "SPY only"]
        default: "top 10"
      only:
        description: "Strategies test: strategy files whose name starts with this (e.g. early). Deck patterns test: version keys (e.g. d_long_trail d_rise). Empty = all"
        type: string
        default: ""
      fee:
        description: "Crypto only: fee per buy and per sell (futures exchange like Binance, or Alpaca spot like the live bot)"
        type: choice
        options: ["0.05% futures", "0.25% Alpaca"]
        default: "0.05% futures"
      source:
        description: "Crypto only: price history. Alpaca 15-min (from 2021, like live) or daily candles from Yahoo/Coinbase (back to 2015; strategy files only)"
        type: choice
        options: ["alpaca 15-min", "daily (from 2015)"]
        default: "alpaca 15-min"
      runs:
        description: "Start dates per version (more = more reliable, slower)"
        type: choice
        options: ["10", "5", "1"]
        default: "10"

permissions:
  contents: write              # to commit the results to reports/backtest/

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Prices saved by earlier runs: only the first run downloads the full history
      - name: Restore saved prices
        uses: actions/cache/restore@v4
        with:
          path: price-cache
          key: price-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: price-cache-

      - name: Backtest
        run: python backtest.py
        env:
          PYTHONUNBUFFERED: "1"
          MARKET: ${{ inputs.market }}
          YEARS: ${{ inputs.years }}
          TEST: ${{ inputs.test }}
          RUNS: ${{ inputs.runs }}
          PATTERN_TF: ${{ inputs.pattern_candles }}
          PATTERN_SET: ${{ inputs.pattern_candles == 'deck' && 'deck' || 'old' }}
          BOT_TF: ${{ inputs.bot_candles }}
          COINS: ${{ inputs.coins }}
          ONLY: ${{ inputs.only }}
          SOURCE: ${{ inputs.source }}
          CRYPTO_FEE: ${{ startsWith(inputs.fee, '0.25') && '0.0025' || '0.0005' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.market == 'crypto' && secrets.TELEGRAM_CHAT_ID_CRYPTO || secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      - name: Save prices for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: price-cache
          key: price-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the results with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest-results/
          if-no-files-found: ignore

      - name: Commit the results to reports/backtest/
        if: always()
        run: |
          [ -f backtest-results/summary.txt ] || { echo "No results"; exit 0; }
          tf=""; [ "${{ inputs.test }}" = "patterns" ] && [ "${{ inputs.pattern_candles }}" != "daily" ] && tf="-${{ inputs.pattern_candles }}"
          [ "${{ inputs.test }}" != "patterns" ] && [ "${{ inputs.bot_candles }}" = "1h" ] && tf="-1h"
          yrs="${{ inputs.years }}"; [ "$tf" = "-15m" ] && [ "$yrs" -gt 5 ] && yrs=5
          coins=""; [ "${{ inputs.market }}" = "crypto" ] && [ "${{ inputs.coins }}" != "top 10" ] && coins="-$(echo '${{ inputs.coins }}' | tr 'A-Z ' 'a-z-')"
          [ "${{ inputs.market }}" = "stocks" ] && [ "${{ inputs.coins }}" = "each stock" ] && coins="-each-stock"
          [ "${{ inputs.market }}" = "stocks" ] && [ "${{ inputs.coins }}" = "SPY only" ] && coins="-spy"
          only=""; [ -n "${{ inputs.only }}" ] && only="-$(echo '${{ inputs.only }}' | tr -d '!' | tr 'A-Z ' 'a-z-')"
          fee=""; [ "${{ inputs.market }}" = "crypto" ] && ! echo "${{ inputs.fee }}" | grep -q '^0.25' && fee="-fee005"
          span="${yrs}y"; case "$yrs" in from*) span="from$(echo "$yrs" | tr -dc 0-9)";; esac
          src=""; [ "${{ inputs.market }}" = "crypto" ] && echo "${{ inputs.source }}" | grep -q '^daily' && src="-daily"
          deck=""; [ "${{ inputs.test }}" = "patterns" ] && [ "${{ inputs.pattern_candles }}" = "deck" ] && deck="-deck" && tf=""
          dir="reports/backtest/${{ inputs.market }}${coins}-$(echo '${{ inputs.test }}' | tr ' ' '-')${deck}${only}${tf}${fee}${src}-${span}"
          mkdir -p "$dir"
          cp backtest-results/summary.txt backtest-results/trades.csv "$dir"/
          for f in details.txt patterns.csv equity.csv each_coin.csv each_stock.csv; do [ -f "backtest-results/$f" ] && cp "backtest-results/$f" "$dir"/; done
          echo "Run ${{ github.run_id }}, $(date -u '+%Y-%m-%d %H:%M UTC'), runs=${{ inputs.runs }}" > "$dir/run.txt"
          git config user.name "backtest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Backtest results: $dir"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
