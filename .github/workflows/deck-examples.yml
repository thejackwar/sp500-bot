name: Deck example charts

# Charts of chosen backtest trades of the deck pattern trader (deck_example_charts.py): win / loss / skip
# (skipped by the 50-day filter). Saved next to the backtest's trades.csv, in examples/.
on:
  workflow_dispatch:
    inputs:
      picks:
        description: "kind:SYMBOL:entry date, space-separated (kind = win, loss or skip)"
        type: string
        default: "win:DELL:2026-03-13 win:CRM:2026-07-29 win:BNY:2026-04-01 loss:PM:2026-06-11 loss:ABT:2024-07-25 loss:AMD:2026-09-18 skip:ANET:2019-10-08 skip:SBUX:2025-04-02"
      leverage:
        description: "Leverage rows of the trades file"
        type: string
        default: "2"

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Draw
        run: python deck_example_charts.py
        env:
          PYTHONUNBUFFERED: "1"
          PICKS: ${{ inputs.picks }}
          LEVERAGE: ${{ inputs.leverage }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports/backtest
          git commit -m "Deck example charts" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
