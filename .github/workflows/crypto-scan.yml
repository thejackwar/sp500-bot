name: Crypto scan

on:
  # The Bitcoin bot (btc_bot.py) decides on the completed daily candle (UTC day), so it runs once a day
  # just after 00:00 UTC (02:07 Milan in summer, 01:07 in winter; GitHub can start it a few minutes late).
  # ~30 runs a month, about 1-2 minutes each. It can also be started by hand: Actions -> Crypto scan.
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      strategy:
        description: "bot = the Bitcoin bot (btc_bot.py: 50-day rule, trades BTC); patterns only = chart-pattern alerts on the top 10 coins, no trades"
        type: choice
        options: ["bot", "patterns only"]
        default: "bot"
      mode:
        description: "Patterns only: intraday candles (the daily chart is always checked). Not used by the Bitcoin bot"
        type: choice
        options: ["15m", "1h", "4h"]
        default: "15m"
      dry_run:
        description: "Dry run: show what it would trade, place no orders"
        type: boolean
        default: false

# one crypto scan at a time
concurrency:
  group: crypto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      STRATEGY: ${{ inputs.strategy == 'patterns only' && 'patterns' || 'bot' }}
      STATE_FILE: ${{ inputs.strategy == 'patterns only' && 'crypto_pattern_state.json' || 'crypto_state.json' }}
      STATE_KEY: ${{ inputs.strategy == 'patterns only' && 'crypto-pattern-state' || 'crypto-state' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore sent-alerts memory
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: ${{ env.STATE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.STATE_KEY }}-

      - name: Scan
        run: python ${{ env.STRATEGY == 'bot' && 'btc_bot.py' || 'crypto_scanner.py' }}
        env:
          PYTHONUNBUFFERED: "1"
          SCAN_MODE: ${{ inputs.mode || '15m' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_CRYPTO || secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      - name: Save sent-alerts memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: ${{ env.STATE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
