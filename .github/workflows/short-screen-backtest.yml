name: Short screen backtest

# Short strategy from a weak-stocks screen (S&P 500 + S&P 400 by default), daily candles, vs SPY
# (short_screen_backtest.py). Results committed to reports/backtest/short-screen-<universes>-<years>y/.
on:
  workflow_dispatch:
    inputs:
      universes:
        description: "Which stocks (space-separated): sp500 sp400 sp600"
        type: string
        default: "sp500 sp400"
      entries:
        description: "Entry triggers to compare: break (20-day-low breakdown) rally (failed rally at falling 20-day MA)"
        type: string
        default: "break rally"
      markets:
        description: "Market filters to compare: none mkt200 (SPY below 200-day MA) mkt50"
        type: string
        default: "none mkt200 mkt50"
      start:
        description: "Optional fixed start date (YYYY-MM-DD); overrides years. Use with yahoo for 2008"
        type: string
        default: ""
      source:
        description: "Prices: alpaca (from 2016) or yahoo (decades back)"
        type: choice
        options: ["alpaca", "yahoo"]
        default: "alpaca"
      years:
        description: "Years to test"
        type: choice
        options: ["8", "5", "3"]
        default: "8"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml
      - name: Backtest
        run: python short_screen_backtest.py
        env:
          PYTHONUNBUFFERED: "1"
          UNIVERSES: ${{ inputs.universes }}
          ENTRIES: ${{ inputs.entries }}
          MARKETS: ${{ inputs.markets }}
          YEARS: ${{ inputs.years }}
          START: ${{ inputs.start }}
          SOURCE: ${{ inputs.source }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit the results
        run: |
          git config user.name "backtest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest
          git commit -m "Short screen backtest: ${{ inputs.universes }} ${{ inputs.years }}y" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
