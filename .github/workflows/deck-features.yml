name: Deck trade features

# Features of every deck backtest trade at entry and in its first days (deck_trade_features.py), to find
# what separates winners from losers. Result committed to reports/analysis/deck-trade-features.csv.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Backtest setup (filter as in the universe backtest)"
        type: string
        default: "ma50+gap2pct+reg200+noweak"
      leverage:
        description: "Leverage of that backtest"
        type: string
        default: "2"

permissions:
  contents: write

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml
      - name: Features
        run: python deck_trade_features.py
        env:
          PYTHONUNBUFFERED: "1"
          FILTER: ${{ inputs.filter }}
          LEVERAGE: ${{ inputs.leverage }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit the results
        run: |
          git config user.name "backtest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/analysis
          git commit -m "Deck trade features: ${{ inputs.filter }} ${{ inputs.leverage }}x" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
