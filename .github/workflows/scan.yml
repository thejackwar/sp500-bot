name: S&P 500 scan

on:
  # Started every 15 minutes by an outside timer (cron-job.org, see README), because GitHub's own
  # schedule often starts runs 5-30 minutes late or skips them. The timer sends source = "timer";
  # those runs still check New York time and only scan between 9:30 and 16:12.
  # Backup: to go back to GitHub's schedule, put these 3 lines back under "on:":
  #   schedule:
  #     - cron: "0,15,30,45 13-21 * * 1-5"
  workflow_dispatch:          # "Run workflow" button (manual tests) and the outside timer
    inputs:
      mode:
        description: "Which candles to scan"
        type: choice
        options: ["15m", "1h"]
        default: "15m"
      alert_any_time:
        description: "Test mode: alert even if the market is closed"
        type: boolean
        default: false
      source:
        description: "Who started it (leave 'manual')"
        type: string
        default: "manual"

# one scan at a time: a late run waits for the previous one instead of overlapping it
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '15m' }}
    steps:
      # Skip quickly (no downloads) when this run falls outside its window in New York time.
      - name: Check market window
        id: window
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          now=$((10#$(TZ=America/New_York date +%H%M)))
          dow=$(TZ=America/New_York date +%u)
          run=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$SOURCE" != "timer" ]; then run=true
          elif [ "$dow" -le 5 ] && [ $now -ge 930 ] && [ $now -le 1612 ]; then run=true
          fi
          echo "New York time $now, mode $SCAN_MODE, started by ${SOURCE:-schedule}, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.window.outputs.run == 'true'

      - name: Restore sent-alerts memory
        if: steps.window.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: alert-state-

      - name: Scan
        if: steps.window.outputs.run == 'true'
        run: python scanner.py
        env:
          PYTHONUNBUFFERED: "1"           # show the log live
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALERT_ANY_TIME: ${{ inputs.alert_any_time && '1' || '0' }}

      - name: Save sent-alerts memory
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}-${{ github.run_attempt }}
