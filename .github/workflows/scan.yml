name: S&P 500 scan

on:
  # Started every 15 minutes by an outside timer (cron-job.org, see README), because GitHub's own
  # schedule often starts runs 5-30 minutes late or skips them. The timer sends source = "timer";
  # those runs still check New York time and only scan between 9:30 and 16:12.
  # Backup: to go back to GitHub's schedule, put these 3 lines back under "on:":
  #   schedule:
  #     - cron: "0,15,30,45 13-21 * * 1-5"
  workflow_dispatch:          # "Run workflow" button (manual tests) and the outside timer
    inputs:
      strategy:
        description: "What to scan for (patterns only = chart patterns, no strategy alerts, no trades)"
        type: choice
        options: ["bot", "patterns only"]
        default: "bot"
      mode:
        description: "Which candles to scan"
        type: choice
        options: ["15m", "1h"]
        default: "15m"
      alert_any_time:
        description: "Test mode: alert even if the market is closed"
        type: boolean
        default: false
      source:
        description: "Who started it (leave 'manual')"
        type: string
        default: "manual"

# one scan at a time: a late run waits for the previous one instead of overlapping it
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '15m' }}
      STRATEGY: ${{ inputs.strategy == 'patterns only' && 'patterns' || 'bot' }}
      # pattern scans keep their own memory of what was already reported
      STATE_FILE: ${{ inputs.strategy == 'patterns only' && 'pattern_state.json' || 'state.json' }}
      STATE_KEY: ${{ inputs.strategy == 'patterns only' && 'pattern-state' || 'alert-state' }}
    steps:
      # Skip quickly (no downloads) when this run falls outside its window in New York time.
      - name: Check market window
        id: window
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          now=$((10#$(TZ=America/New_York date +%H%M)))
          dow=$(TZ=America/New_York date +%u)
          run=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$SOURCE" != "timer" ]; then run=true
          elif [ "$dow" -le 5 ] && [ $now -ge 930 ] && [ $now -le 1612 ]; then run=true
          fi
          echo "New York time $now, mode $SCAN_MODE, started by ${SOURCE:-schedule}, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.window.outputs.run == 'true'

      - name: Restore sent-alerts memory
        if: steps.window.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: ${{ env.STATE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.STATE_KEY }}-

      - name: Scan
        if: steps.window.outputs.run == 'true'
        run: python scanner.py
        env:
          PYTHONUNBUFFERED: "1"           # show the log live
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          # "patterns only" scans go to the pattern group (if set), the bot's alerts to the stock chat
          TELEGRAM_CHAT_ID: ${{ inputs.strategy == 'patterns only' && (secrets.TELEGRAM_CHAT_ID_PATTERNS || secrets.TELEGRAM_CHAT_ID) || secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALERT_ANY_TIME: ${{ inputs.alert_any_time && '1' || '0' }}

      - name: Save sent-alerts memory
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: ${{ env.STATE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Pattern paper trader (pattern_trader.py, its own Alpaca paper account): runs once per market day,
      # in the first scan after 9:30 New York. Does nothing until the ALPACA_PATTERN_* secrets exist.
      - name: Restore pattern-trader memory
        if: always() && steps.window.outputs.run == 'true' && env.STRATEGY == 'bot'
        uses: actions/cache/restore@v4
        with:
          path: pattern_trader_state.json
          key: pattern-trader-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pattern-trader-

      - name: Pattern trader
        id: ptrader
        if: always() && steps.window.outputs.run == 'true' && env.STRATEGY == 'bot'
        run: python pattern_trader.py
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_PATTERNS || secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PATTERN_KEY_ID: ${{ secrets.ALPACA_PATTERN_KEY_ID }}
          ALPACA_PATTERN_SECRET_KEY: ${{ secrets.ALPACA_PATTERN_SECRET_KEY }}

      - name: Save pattern-trader memory
        if: always() && steps.window.outputs.run == 'true' && env.STRATEGY == 'bot' && hashFiles('pattern_trader_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: pattern_trader_state.json
          key: pattern-trader-${{ github.run_id }}-${{ github.run_attempt }}

      # Deck pattern trader (deck_trader.py, same pattern account; replaces the old trader's entries since
      # 21 Oct 2026): every scan reports stops/targets hit; the first scan after 9:30 New York opens trades.
      - name: Restore deck-trader memory
        if: always() && steps.window.outputs.run == 'true' && env.STRATEGY == 'bot'
        uses: actions/cache/restore@v4
        with:
          path: deck_trader_state.json
          key: deck-trader-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: deck-trader-

      - name: Deck pattern trader
        if: always() && steps.window.outputs.run == 'true' && env.STRATEGY == 'bot'
        run: python deck_trader.py
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_PATTERNS || secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PATTERN_KEY_ID: ${{ secrets.ALPACA_PATTERN_KEY_ID }}
          ALPACA_PATTERN_SECRET_KEY: ${{ secrets.ALPACA_PATTERN_SECRET_KEY }}

      - name: Save deck-trader memory
        if: always() && steps.window.outputs.run == 'true' && env.STRATEGY == 'bot' && hashFiles('deck_trader_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: deck_trader_state.json
          key: deck-trader-${{ github.run_id }}-${{ github.run_attempt }}
