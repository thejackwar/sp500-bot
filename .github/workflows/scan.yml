name: S&P 500 scan

on:
  schedule:
    # Every hour at :50 (UTC), Mon-Fri. Covers US market hours in both summer and
    # winter time (Milan 15:50-23:50). Runs outside market hours exit with no alerts.
    - cron: "50 13-21 * * 1-5"
  workflow_dispatch:          # "Run workflow" button for manual tests
    inputs:
      alert_any_time:
        description: "Test mode: alert even if the market is closed"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore sent-alerts memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: alert-state-

      - name: Scan
        run: python scanner.py
        env:
          PYTHONUNBUFFERED: "1"           # show the log live
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALERT_ANY_TIME: ${{ inputs.alert_any_time && '1' || '0' }}

      - name: Save sent-alerts memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}-${{ github.run_attempt }}
