name: Friday high -> Monday short trade charts

on:
  workflow_dispatch:
    inputs:
      tf:
        description: "Timeframe in minutes (5, 15, 60)"
        type: string
        default: "15"
      entry:
        description: "Entry type (A, B, C, ctrl)"
        type: string
        default: "C"
      rr:
        description: "Risk-to-reward (1, 1.5, 2, 3)"
        type: string
        default: "2"
      seed:
        description: "Random pick (change it to see other trades)"
        type: string
        default: "1"

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore saved 5-minute prices
        uses: actions/cache/restore@v4
        with:
          path: price-cache-fhm
          key: fhm-cache-none
          restore-keys: fhm-cache-
      - name: Charts
        run: python friday_monday_charts.py
        env:
          VARIANT_TF: ${{ inputs.tf }}
          VARIANT_ENTRY: ${{ inputs.entry }}
          VARIANT_RR: ${{ inputs.rr }}
          SEED: ${{ inputs.seed }}
      - name: Commit the charts
        run: |
          dir="reports/backtest/friday-monday-v1/charts/${{ inputs.tf }}m-${{ inputs.entry }}-${{ inputs.rr }}-seed${{ inputs.seed }}"
          mkdir -p "$dir"
          cp backtest-results/charts/*.png "$dir"/
          git config user.name "backtest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Friday->Monday trade charts: $dir"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
