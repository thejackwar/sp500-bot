name: Friday low rule - example chart

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Random pick (change it for other examples)"
        type: string
        default: "3"

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: price-cache-fhm
          key: fhm-cache-none
          restore-keys: fhm-cache-
      - run: python friday_low_chart.py
        env:
          SEED: ${{ inputs.seed }}
      - name: Commit the chart
        run: |
          dir="reports/backtest/friday-low-sp100-stops/charts"
          mkdir -p "$dir"
          cp backtest-results/charts/rule_2to1_example.png "$dir/rule_2to1_example_seed${{ inputs.seed }}.png"
          git config user.name "backtest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Friday low rule example chart"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
