name: Friday lower high -> Monday visits Friday low

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols, space-separated (empty = the S&P 100)"
        type: string
        default: ""
      min_rr:
        description: "Minimum reward:risk for section 6 (2 = 2:1, 3 = 3:1)"
        type: string
        default: "2"
      name:
        description: "Results folder name (reports/backtest/friday-low-<name>)"
        type: string
        default: "sp100"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore saved 5-minute prices (from the Friday->Monday backtest)
        uses: actions/cache/restore@v4
        with:
          path: price-cache-fhm
          key: fhm-cache-none
          restore-keys: fhm-cache-
      - name: Test the rule
        run: python friday_low_test.py
        env:
          PYTHONUNBUFFERED: "1"
          SYMBOLS: ${{ inputs.symbols }}
          MIN_RR: ${{ inputs.min_rr }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit the results
        run: |
          [ -f backtest-results/summary.txt ] || { echo "No results"; exit 0; }
          dir="reports/backtest/friday-low-${{ inputs.name }}"
          mkdir -p "$dir"
          cp backtest-results/summary.txt backtest-results/days.csv.gz "$dir"/
          git config user.name "backtest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Friday low rule results: $dir"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
