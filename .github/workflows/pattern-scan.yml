name: Pattern scan

# Chart patterns from the Fidelity "Identifying Chart Patterns" deck on the S&P 100 (pattern_scan.py,
# rules in deck_patterns.py). Sends each new pattern (forming or broken out) to the Telegram pattern
# group with its chart, then one summary. Never trades.
# Runs by itself once a day after the US close on daily candles. GitHub starts it at 20:40 and 21:40 UTC;
# only the run that falls between 16:15 and 17:30 New York time scans (20:40 in summer = 16:40 NY, 21:40 in winter =
# 16:40 NY), so it arrives at about 22:40-23:00 Milan. Can also be started by hand.
on:
  schedule:
    - cron: "40 20,21 * * 1-5"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Candles to scan"
        type: choice
        options: ["1d", "1h"]
        default: "1d"
      preview:
        description: "Preview: save the charts to reports/pattern-scan/ in the repo, send nothing to Telegram"
        type: boolean
        default: false
      resend:
        description: "Send everything found now, even patterns already sent before"
        type: boolean
        default: false

concurrency:
  group: pattern-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PATTERN_TF: ${{ inputs.timeframe || '1d' }}
      STATE_FILE: deck_pattern_state_${{ inputs.timeframe || '1d' }}.json
    steps:
      - name: Check time (scheduled runs only)
        id: window
        run: |
          now=$((10#$(TZ=America/New_York date +%H%M)))
          run=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ $now -lt 1615 ] || [ $now -gt 1730 ]; }; then run=false; fi
          echo "New York time $now, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.window.outputs.run == 'true'

      - name: Restore sent-patterns memory
        if: steps.window.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: deck-pattern-state-${{ env.PATTERN_TF }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: deck-pattern-state-${{ env.PATTERN_TF }}-

      - name: Scan
        if: steps.window.outputs.run == 'true'
        run: python pattern_scan.py
        env:
          PYTHONUNBUFFERED: "1"
          PREVIEW: ${{ inputs.preview && '1' || '0' }}
          RESEND: ${{ inputs.resend && '1' || '0' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_PATTERNS || secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      - name: Save sent-patterns memory
        if: always() && steps.window.outputs.run == 'true' && !inputs.preview && hashFiles(env.STATE_FILE) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: deck-pattern-state-${{ env.PATTERN_TF }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit preview charts
        if: steps.window.outputs.run == 'true' && inputs.preview
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports/pattern-scan
          git commit -m "Pattern scan preview ($PATTERN_TF)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
