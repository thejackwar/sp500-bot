name: Friday high -> Monday short backtest

on:
  workflow_dispatch:          # run it by hand: Actions -> Friday high -> Monday short backtest -> Run workflow
    inputs:
      start:
        description: "First Monday to test (out-of-sample starts 2025-01-01)"
        type: string
        default: "2021-01-01"
      name:
        description: "Results folder name (reports/backtest/friday-monday-<name>)"
        type: string
        default: "v1"

permissions:
  contents: write              # to commit the results to reports/backtest/

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Own cache: only the first run downloads everything (5-minute bars, 100 stocks)
      - name: Restore saved 5-minute prices
        uses: actions/cache/restore@v4
        with:
          path: price-cache-fhm
          key: fhm-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fhm-cache-

      - name: Backtest
        run: python friday_monday_backtest.py
        env:
          PYTHONUNBUFFERED: "1"
          START: ${{ inputs.start }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      - name: Save prices for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: price-cache-fhm
          key: fhm-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the results with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-monday-results
          path: backtest-results/
          if-no-files-found: ignore

      - name: Commit the results to reports/backtest/
        if: always()
        run: |
          [ -f backtest-results/summary.txt ] || { echo "No results"; exit 0; }
          dir="reports/backtest/friday-monday-${{ inputs.name }}"
          mkdir -p "$dir"
          cp backtest-results/summary.txt "$dir"/
          gzip -c backtest-results/trades.csv > "$dir/trades.csv.gz"
          echo "Run ${{ github.run_id }}, $(date -u '+%Y-%m-%d %H:%M UTC')" > "$dir/run.txt"
          git config user.name "backtest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Friday->Monday backtest results: $dir"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
