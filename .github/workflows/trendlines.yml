name: Trendlines

# Type a ticker -> charts with the automatic trendlines on W, D, 4H, 1H, 30m, 15m and 5m.
# Rules: see trendlines.py. Charts go to Telegram, to this run's downloads, and to
# reports/trendlines/<TICKER>/ in the repo (replaced on every run).
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Ticker(s), e.g. AAPL or AAPL, NVDA (SPX -> uses SPY)"
        type: string
        required: true
        default: "SPY"
      timeframes:
        description: "Which charts (empty = all): e.g. W D 1H 15m"
        type: string
        default: ""
      swing:
        description: "Swing strength (bars on each side)"
        type: string
        default: "5"
      break_by:
        description: "A line is broken by a"
        type: choice
        options: ["close", "wick"]
        default: "close"
      higher_tf_lines:
        description: "Also draw the higher timeframes' lines (dashed) on each chart"
        type: boolean
        default: false
      telegram:
        description: "Send the charts to Telegram"
        type: boolean
        default: true

permissions:
  contents: write              # to save the charts in reports/trendlines/

concurrency:
  group: trendlines
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Draw the trendlines
        run: python trendlines.py
        env:
          PYTHONUNBUFFERED: "1"
          TICKERS: ${{ inputs.tickers }}
          TIMEFRAMES: ${{ inputs.timeframes }}
          SWING: ${{ inputs.swing }}
          BREAK_BY: ${{ inputs.break_by }}
          SHOW_HTF: ${{ inputs.higher_tf_lines && '1' || '0' }}
          SEND_TELEGRAM: ${{ inputs.telegram && '1' || '0' }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Keep the charts with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendlines
          path: trendlines-out/
          if-no-files-found: ignore

      - name: Save the charts in the repo
        if: always()
        run: |
          [ -d trendlines-out ] || { echo "No charts"; exit 0; }
          for d in trendlines-out/*/; do
            t=$(basename "$d"); rm -rf "reports/trendlines/$t"; mkdir -p "reports/trendlines/$t"
            cp "$d"* "reports/trendlines/$t/"
          done
          git config user.name "trendlines bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/trendlines
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Trendlines: ${{ inputs.tickers }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
