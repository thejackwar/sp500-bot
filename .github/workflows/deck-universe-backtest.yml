name: Deck universe backtest

# Version 6 of the deck pattern trader on whole universes (S&P 100 and S&P 500), daily candles, vs SPY
# (deck_universe_backtest.py). Results committed to reports/backtest/universe-deck-v6-<years>y/.
on:
  workflow_dispatch:
    inputs:
      universes:
        description: "Which stocks (space-separated): sp100 sp500"
        type: string
        default: "sp100 sp500"
      start:
        description: "Optional fixed start date (YYYY-MM-DD); overrides years"
        type: string
        default: ""
      filters:
        description: "Filters to compare (combine with +): none ma50 ma200 ma50_200 both ma50_rising vol12 vol15 vol20 dry; entry rules gap1atr gap2pct risk2x limit05"
        type: string
        default: "none"
      leverages:
        description: "Leverage levels to compare (1 = none), e.g. 1 1.5 2 3"
        type: string
        default: "1"
      source:
        description: "Prices: alpaca (from 2016) or yahoo (from 2000 or earlier, use with start)"
        type: choice
        options: ["alpaca", "yahoo"]
        default: "alpaca"
      years:
        description: "Years to test"
        type: choice
        options: ["8", "5", "3"]
        default: "8"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml
      - name: Backtest
        run: python deck_universe_backtest.py
        env:
          PYTHONUNBUFFERED: "1"
          UNIVERSES: ${{ inputs.universes }}
          YEARS: ${{ inputs.years }}
          LEVERAGES: ${{ inputs.leverages }}
          START: ${{ inputs.start }}
          FILTERS: ${{ inputs.filters }}
          SOURCE: ${{ inputs.source }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit the results
        run: |
          git config user.name "backtest bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backtest
          git commit -m "Deck universe backtest: ${{ inputs.universes }} ${{ inputs.years }}y" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
