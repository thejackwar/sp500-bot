name: S&P 500 scan

on:
  schedule:
    # Times are UTC; each run checks New York time itself, so summer/winter time changes are handled.
    # 15-minute checks for the first 3 hours after the open (Milan ~15:30-18:30)
    - cron: "2,17,32,47 13-17 * * 1-5"
    # Hourly checks for the rest of the trading day (Milan ~18:50-22:50)
    - cron: "50 15-21 * * 1-5"
  workflow_dispatch:          # "Run workflow" button for manual tests
    inputs:
      mode:
        description: "Which candles to scan"
        type: choice
        options: ["15m", "1h"]
        default: "15m"
      alert_any_time:
        description: "Test mode: alert even if the market is closed"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '50 15-21 * * 1-5' && '1h' || '15m') }}
    steps:
      # Skip quickly (no downloads) when this run falls outside its window in New York time.
      - name: Check market window
        id: window
        run: |
          now=$((10#$(TZ=America/New_York date +%H%M)))
          dow=$(TZ=America/New_York date +%u)
          run=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then run=true
          elif [ "$dow" -le 5 ] && [ "$SCAN_MODE" = "15m" ] && [ $now -ge 1000 ] && [ $now -le 1310 ]; then run=true
          elif [ "$dow" -le 5 ] && [ "$SCAN_MODE" = "1h" ] && [ $now -ge 1245 ] && [ $now -le 1730 ]; then run=true
          fi
          echo "New York time $now, mode $SCAN_MODE, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.window.outputs.run == 'true'

      - name: Restore sent-alerts memory
        if: steps.window.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: alert-state-

      - name: Scan
        if: steps.window.outputs.run == 'true'
        run: python scanner.py
        env:
          PYTHONUNBUFFERED: "1"           # show the log live
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALERT_ANY_TIME: ${{ inputs.alert_any_time && '1' || '0' }}

      - name: Save sent-alerts memory
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}-${{ github.run_attempt }}
